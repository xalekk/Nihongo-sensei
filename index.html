<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongo Sensei</title>
    <meta name="description" content="Apprendre le japonais en 365 jours, du tout début au niveau N5, en français.">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nihongo">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="entete">
        <div class="entete-int">
            <div class="marque">
                <img src="assets/logo.svg" alt="" width="42" height="42">
                <div>
                    <h1>Nihongo Sensei</h1>
                    <p>日本語先生 · Le japonais en 365 jours</p>
                </div>
            </div>
            <span class="xp" id="entete-xp">0 XP</span>
        </div>
    </header>

    <nav class="onglets" aria-label="Navigation principale">
        <div class="onglets-int">
            <button data-onglet="parcours" class="actif">Parcours</button>
            <button data-onglet="dojo">Dōjō</button>
            <button data-onglet="sons">Sons</button>
            <button data-onglet="dico">Dictionnaire</button>
        </div>
    </nav>

    <main id="vue" class="vue"></main>

    <div id="fenetre" class="fenetre cache" role="dialog" aria-modal="true"></div>
    <div id="toast" class="toast cache" role="status"></div>

    <script src="js/langue.js"></script>
    <script src="js/donnees/kana.js"></script>
    <script src="js/donnees/prononciation.js"></script>
    <script src="js/donnees/karate.js"></script>
    <script src="js/donnees/etape01.js"></script>
    <script src="js/donnees/etape02.js"></script>
    <script src="js/donnees/etape03.js"></script>
    <script src="js/donnees/etape04.js"></script>
    <script src="js/donnees/etape05.js"></script>
    <script src="js/donnees/etape06.js"></script>
    <script src="js/donnees/etape07.js"></script>
    <script src="js/donnees/etape08.js"></script>
    <script src="js/donnees/etape09.js"></script>
    <script src="js/donnees/etape10.js"></script>
    <script src="js/donnees/etape11.js"></script>
    <script src="js/donnees/etape12.js"></script>
    <script src="js/donnees/etape13.js"></script>
    <script src="js/cours.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
